<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registrasi – Catering Bunda Rahma</title>
<meta name="description" content="Buat akun baru Catering Bunda Rahma dan nikmati layanan katering harian terbaik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css">
<script src="navbar.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="Catering Bunda Rahma – Landing Page.html" aria-label="Catering Bunda Rahma">
      <img src="logo.webp" alt="Logo Catering Bunda Rahma" width="48" height="48">
      <span class="brand-text">
        <span class="brand-title">Catering Bunda Rahma</span>
      </span>
    </a>
    <button class="burger" aria-label="Buka menu" aria-expanded="false" aria-controls="nav"><span></span></button>
    <nav class="nav" id="nav" aria-label="Navigasi utama">
      <a href="Catering Bunda Rahma – Landing Page.html">Beranda</a>
      <a href="Catering Bunda Rahma – Landing Page.html#tentang">Tentang</a>
      <a href="Catering Bunda Rahma – Pilih Menu.html">Menu</a>
      <a href="Catering Bunda Rahma – Landing Page.html#langganan">Langganan</a>
      <a href="Catering Bunda Rahma – Riwayat Pesanan.html">Riwayat</a>
      <a class="btn-nav active" href="Catering Bunda Rahma – Registrasi.html" aria-current="page">Register</a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-box">
    <div class="auth-visual">
      <img src="auth_side.webp" alt="Sajian Lezat Catering Bunda Rahma" width="540" height="680" loading="eager">
      <div class="auth-visual-overlay">
        <h3>Catering Bunda Rahma</h3>
        <p>Enak • Lezat • Tepat Waktu</p>
      </div>
    </div>
    <div class="auth-form-card">
      <section aria-labelledby="judul">
        <h1 id="judul">Buat Akun Baru</h1>

        <form id="form" novalidate>
          <div class="auth-field">
            <label for="nama">Nama Lengkap</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="nama" name="nama" type="text" autocomplete="name"
                placeholder="Masukkan nama lengkap" required aria-describedby="e-nama">
            </div>
            <p class="auth-err" id="e-nama" aria-live="polite"></p>
          </div>

          <div class="auth-field">
            <label for="email">Email</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="email" name="email" type="email" inputmode="email"
                autocomplete="email" placeholder="nama@email.com" required aria-describedby="e-email">
            </div>
            <p class="auth-err" id="e-email" aria-live="polite"></p>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-input-wrap">
              <input class="auth-input" id="password" name="password" type="password"
                autocomplete="new-password" placeholder="Minimal 8 karakter" minlength="8" required aria-describedby="e-password">
              <button class="pw-toggle" type="button" aria-label="Tampilkan password" aria-pressed="false">
                <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="auth-err" id="e-password" aria-live="polite"></p>
          </div>

          <button class="auth-submit" type="submit" id="submitBtn">Daftar Sekarang</button>
          <p class="auth-status" id="status" role="status"></p>
        </form>

        <p class="auth-alt">Sudah punya akun? <a href="Catering Bunda Rahma – Login.html">Login di sini</a></p>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-min">
      <a class="footer-brand-min" href="Catering Bunda Rahma – Landing Page.html" aria-label="Catering Bunda Rahma">
        <img src="logo.webp" alt="" width="26" height="26" loading="lazy">
        <span>Catering Bunda Rahma</span>
      </a>
      <div class="footer-right">
        <p class="footer-copy">&copy; 2026 Catering Bunda Rahma. Semua Hak Dilindungi.</p>
        <span class="footer-sep">•</span>
        <span class="footer-tag">Enak &bull; Lezat &bull; Tepat Waktu</span>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  var form = document.getElementById('form');
  var status = document.getElementById('status');
  var btn = document.getElementById('submitBtn') || form.querySelector('.submit');
  var eye = form.querySelector('.pw-toggle');
  var pw = document.getElementById('password');

  // Existing registered emails (Use Case 1 Alternatif A2)
  var registeredEmails = [
    'budi.santoso@example.com',
    'siti.aminah@example.com',
    'admin@cateringbunda.id',
    'pelanggan@cateringbunda.id'
  ];

  if (eye) {
    eye.addEventListener('click', function(){
      var show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      eye.setAttribute('aria-pressed', show);
      eye.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
    });
  }

  var rules = {
    nama: function(v){ return v.trim().length < 2 ? 'Nama wajib diisi minimal 2 karakter.' : ''; },
    email: function(v){
      var clean = v.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) return 'Masukkan format email yang valid.';
      if (registeredEmails.indexOf(clean) !== -1) return 'Email sudah terdaftar. Silakan login.';
      return '';
    },
    password: function(v){ return v.length < 8 ? 'Password minimal 8 karakter.' : ''; }
  };

  function check(id){
    var el = document.getElementById(id), msg = rules[id](el.value);
    document.getElementById('e-' + id).textContent = msg;
    el.setAttribute('aria-invalid', msg ? 'true' : 'false');
    return !msg;
  }

  Object.keys(rules).forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener('blur', function(){ if(el.value) check(id); });
    el.addEventListener('input', function(){ if(el.getAttribute('aria-invalid') === 'true') check(id); });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    status.textContent = '';
    var ok = Object.keys(rules).map(check).every(Boolean);
    if (!ok) {
      form.querySelector('[aria-invalid="true"]').focus();
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Memproses Pendaftaran…';

    var data = { nama: form.nama.value.trim(), email: form.email.value.trim(), password: form.password.value };

    setTimeout(function(){
      btn.disabled = false;
      btn.textContent = 'Daftar';
      status.style.color = '#fae491';
      status.innerHTML = '✓ Pendaftaran berhasil! Akun tersimpan. Mengalihkan ke <a href="Catering Bunda Rahma – Login.html" style="color:#fff;text-decoration:underline;">halaman Login</a>…';
      registeredEmails.push(data.email.toLowerCase());
      setTimeout(function(){
        window.location.href = 'Catering Bunda Rahma – Login.html';
      }, 700);
    }, 500);
  });
})();
</script>
</body>
</html>
